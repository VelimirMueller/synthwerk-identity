# fleet.yml: tier and visibility of this repo (STANDARD.md). Exceptions: docs/rollout.md.
tier: deploys
visibility: public

exceptions:
  - rule: WF-NAME-02
    value:
      ci.yml: [integration]
    reason: The unit stage runs without network services (CI-UNIT-05); the integration job tests orgs, members and roles against real Postgres on every PR.
  - rule: CI-COST-15
    value: 4
    reason: The integration job is the fourth PR job; it is the only test against real Postgres and the repo is public (free minutes).
    expires: 2027-04-30
  - rule: CI-UNIT-03
    value:
      lines: 30
    reason: Unit tests cover 33.9 % of internal/ today; the orgs store and HTTP path and the Postgres store of the Zitadel hook are tested only by the integration job. ci.yml sets coverage-floor 30; raise it as unit tests land.
