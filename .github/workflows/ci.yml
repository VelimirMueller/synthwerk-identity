# Thin caller of the synthwerk blueprint go-ci: gofmt, golangci-lint, go test, go build.
# Required check for the ruleset: "ci / check" (the gate over the blueprint job).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  # Blueprint: gofmt, golangci-lint, go test -race ./..., go build.
  ci:
    permissions:
      contents: read
    uses: VelimirMueller/synthwerk-blueprint/.github/workflows/go-ci.yml@v1

  # One check over the blueprint job.
  check:
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == "success" ]] || exit 1
          done
